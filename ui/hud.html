<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nesa dictation</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* The pill floats over other apps. Its window is transparent, and only as big as the pill plus a margin for its shadow. */
    html, body { background: transparent; }
    body { display: block; overflow: hidden; }
    .dictation { position: absolute; left: 50%; top: 50%; translate: -50% -50%; }
    .dictation.is-visible { width: 520px; }
  </style>
</head>
<body>
  <div class="dictation" id="hud-pill" data-mode="idle">
    <span class="dictation-badge" aria-hidden="true">
      <svg class="badge-mic" viewBox="0 0 16 16"><rect x="5.5" y="2" width="5" height="7.5" rx="2.5"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2"/></svg>
      <svg class="badge-check" viewBox="0 0 16 16"><path d="M3.5 8.5 6.5 11.5 12.5 4.5"/></svg>
      <svg class="badge-alert" viewBox="0 0 16 16"><path d="M8 3.5v5.25M8 11.75v.25"/></svg>
      <span class="badge-spinner"></span>
    </span>
    <span class="dictation-main">
      <span class="dictation-head">
        <span class="dictation-label" id="hud-label" role="status" aria-live="polite"></span>
        <span class="dictation-meta" id="hud-meta" aria-hidden="true"></span>
      </span>
      <span class="dictation-text" id="hud-text" data-kind="tail"><span class="dictation-words" id="hud-words"></span></span>
    </span>
    <span class="dictation-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
  </div>
  <script src="hud.js"></script>
</body>
</html>
