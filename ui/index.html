<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nesa</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-head" data-tauri-drag-region>
      <span class="brand-mark" data-tauri-drag-region><svg viewBox="340 250 344 520" aria-hidden="true"><path d="M396 706V318L628 706V318" fill="none" stroke="currentColor" stroke-width="86" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand" data-tauri-drag-region>Nesa</span>
    </div>
    <div class="sidebar-section" title="⌘] next session · ⌘[ previous session · ⌘J next finished session">
      <span class="section-label" data-tauri-drag-region>Groups</span>
      <button class="icon-btn" id="new-group" title="New group" aria-label="New group" data-icon="plus"></button>
    </div>
    <nav class="group-list" id="group-list" aria-label="Groups"></nav>
    <div class="sidebar-foot">
      <button class="btn" id="alerts-toggle" aria-pressed="true">Done alerts: On</button>
    </div>
  </aside>

  <main class="main">
    <header class="toolbar" data-tauri-drag-region>
      <h1 class="toolbar-title" id="group-title" data-tauri-drag-region></h1>
      <span class="toolbar-count" id="group-count" data-tauri-drag-region></span>
      <div class="summary" id="summary"></div>
      <span class="spacer" data-tauri-drag-region></span>
      <button class="btn" id="new-claude"><span class="logo logo-claude" data-logo="claude"></span>New Claude</button>
      <button class="btn" id="new-codex"><span class="logo logo-openai" data-logo="openai"></span>New Codex</button>
    </header>

    <section class="stage">
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden>
        <div class="empty-mark"><svg viewBox="340 250 344 520" aria-hidden="true"><path d="M396 706V318L628 706V318" fill="none" stroke="currentColor" stroke-width="86" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h2 id="empty-title">No sessions in this group</h2>
        <p>Each session runs in its own folder, and every one stays visible here.</p>
        <div class="empty-actions">
          <button class="empty-action" id="empty-claude">
            <span class="logo logo-claude" data-logo="claude"></span>
            <span class="empty-action-text"><strong>New Claude session</strong><small>Claude Code in a folder</small></span>
          </button>
          <button class="empty-action" id="empty-codex">
            <span class="logo logo-openai" data-logo="openai"></span>
            <span class="empty-action-text"><strong>New Codex session</strong><small>Codex CLI in a folder</small></span>
          </button>
        </div>
        <p class="empty-hint"><kbd>&#8984;</kbd><kbd>N</kbd> starts a session from anywhere</p>
      </div>
    </section>
  </main>

  <!-- Hidden holder that keeps terminals of off-screen cards alive. -->
  <div id="parking" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Voice pill: a small dot in the toolbar while idle. Holding Option opens it into a bar with the state,
       the destination session, the newest words and a level meter. It ignores the pointer. -->
  <div class="dictation" id="dictation" data-mode="idle">
    <span class="dictation-badge" aria-hidden="true">
      <svg class="badge-mic" viewBox="0 0 16 16"><rect x="5.5" y="2" width="5" height="7.5" rx="2.5"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2"/></svg>
      <svg class="badge-check" viewBox="0 0 16 16"><path d="M3.5 8.5 6.5 11.5 12.5 4.5"/></svg>
      <svg class="badge-alert" viewBox="0 0 16 16"><path d="M8 3.5v5.25M8 11.75v.25"/></svg>
      <span class="badge-spinner"></span>
    </span>
    <span class="dictation-main">
      <span class="dictation-head">
        <span class="dictation-label" id="dictation-label" role="status" aria-live="polite"></span>
        <span class="dictation-meta" id="dictation-meta" aria-hidden="true"></span>
      </span>
      <span class="dictation-text" id="dictation-text" data-kind="tail"><span class="dictation-words" id="dictation-words"></span></span>
    </span>
    <span class="dictation-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
  </div>

  <dialog id="new-session" class="dialog">
    <form id="new-session-form" autocomplete="off" spellcheck="false">
      <h2 class="dialog-title">New session</h2>

      <div class="segmented" role="radiogroup" aria-label="Agent">
        <button type="button" role="radio" data-kind="claude"><span class="logo logo-claude" data-logo="claude"></span>Claude</button>
        <button type="button" role="radio" data-kind="codex"><span class="logo logo-openai" data-logo="openai"></span>Codex</button>
      </div>

      <label class="field">
        <span class="field-label">Name <em>optional</em></span>
        <input class="input" id="session-name" type="text" maxlength="80" placeholder="Defaults to the agent name">
      </label>

      <div class="field">
        <label class="field-label" for="session-cwd">Folder</label>
        <div class="field-row">
          <input class="input mono" id="session-cwd" type="text" placeholder="/path/to/project">
          <button type="button" class="btn btn-outline" id="browse">Browse</button>
        </div>
        <div class="recent" id="recent" hidden></div>
      </div>

      <p class="form-error" id="session-error" role="alert" hidden></p>

      <div class="dialog-actions">
        <button type="button" class="btn" id="session-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="session-start">Start</button>
      </div>
    </form>
  </dialog>

  <dialog id="prompt" class="dialog dialog-narrow">
    <form id="prompt-form" autocomplete="off" spellcheck="false">
      <h2 class="dialog-title" id="prompt-title"></h2>
      <input class="input" id="prompt-input" type="text" maxlength="80" aria-label="Name">
      <div class="dialog-actions">
        <button type="button" class="btn" id="prompt-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="prompt-ok">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm" class="dialog dialog-narrow">
    <form id="confirm-form" method="dialog">
      <h2 class="dialog-title" id="confirm-title"></h2>
      <p class="dialog-text" id="confirm-text"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" id="confirm-cancel">Cancel</button>
        <button type="submit" class="btn btn-danger" id="confirm-ok">Delete</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
